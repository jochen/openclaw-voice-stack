# Projektname = Rolle + Host, wie in openclaw-fablab-llm (dort `fablab-llm`).
# Hiess bis 2026-08-01 `ai-stack-gastonllm` — der Name des inzwischen
# archivierten Vorgaenger-Repos, der beim Repo-Split mitgeschleppt wurde. Weil
# ihn DREI Verzeichnisse trugen (~/ai-stack, ~/voice-stack, dieses hier),
# konnten sich die Stacks gegenseitig die Container wegnehmen; ein Handstart
# aus dem alten Verzeichnis fiel monatelang nicht auf. Ein Projektname gehoert
# genau einer Compose-Datei.
#
# Was NICHT hierher gehoert: infinity (Embeddings fuer OpenClaws Memory) liegt
# in ~/openclaw-gastonllm, Projektname openclaw-gastonllm. Dieser Stack ist
# ausschliesslich die Sprach-Pipeline.
name: voice-gastonllm

services:

  # ── Speech AI ────────────────────────────────────────────────────────────────
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    container_name: speaches
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "8000:8000"
    environment:
      # RTX 3060 Ti ist Ampere (GA104) mit Tensor Cores - im Gegensatz zu rouvens
      # GTX 1660 (Turing TU116, keine Tensor Cores) funktioniert int8 hier korrekt
      # (kein Whisper-Halluzinations-Bug, siehe compose.rouven.yml).
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=int8
      - STT_MODEL_TTL=-1
      - TTS_MODEL_TTL=-1
      - CUDA_CACHE_PATH=/home/ubuntu/.cache/cuda
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
      - speaches-cuda-cache:/home/ubuntu/.cache/cuda
      - ./scripts/speaches-entrypoint.sh:/speaches-entrypoint.sh:ro
      - ./patches/onnx_diarization_pipeline.py:/home/ubuntu/speaches/.venv/lib/python3.12/site-packages/onnx_diarization/pipeline.py:ro
    entrypoint: ["/speaches-entrypoint.sh"]
    command: ["uvicorn", "--factory", "speaches.main:create_app"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  speaches-warmup:
    image: quay.io/curl/curl:latest
    container_name: speaches-warmup
    depends_on:
      speaches:
        condition: service_healthy
    environment:
      - STT_MODEL=guillaumekln/faster-whisper-small
      - TTS_MODEL=speaches-ai/piper-de_DE-thorsten-medium
      - TTS_VOICE=de_DE-thorsten-medium
      - DIARIZATION_SEGMENTATION_MODEL=fedirz/segmentation_community_1
      - DIARIZATION_EMBEDDING_MODEL=Wespeaker/wespeaker-voxceleb-resnet34-LM
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        echo "Registering STT: $STT_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$STT_MODEL" || true
        echo "Registering TTS: $TTS_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$TTS_MODEL" || true
        echo "Registering Diarization: $DIARIZATION_SEGMENTATION_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$DIARIZATION_SEGMENTATION_MODEL" || true
        echo "Registering Diarization: $DIARIZATION_EMBEDDING_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$DIARIZATION_EMBEDDING_MODEL" || true
        echo "Warmup TTS (piper -> VRAM)"
        curl -sf -X POST http://speaches:8000/v1/audio/speech \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$TTS_MODEL\",\"voice\":\"$TTS_VOICE\",\"input\":\"Aufwärmen.\",\"response_format\":\"wav\"}" \
          -o /tmp/warmup.wav
        echo "Warmup STT (whisper -> VRAM)"
        curl -sf -X POST http://speaches:8000/v1/audio/transcriptions \
          -F "file=@/tmp/warmup.wav" -F "model=$STT_MODEL" -F "language=de"
        echo ""
        echo "Speaches models ready."
    restart: "no"

  # ── SER – Speech Emotion Recognition (wav2vec2-large) ────────────────────────
  # Seit 2026-10-05 auf der CPU (keine GPU-Geraete -> app.py nimmt "cpu"):
  # macht 1,9 GB auf der 3060 Ti frei, damit Qwen3-ASR dort Platz hat. Die
  # Stimmung braucht nur der Brain-Weg, und der wartete ohnehin ~2 s auf die
  # Sprechererkennung. Gemessen (30 Clips): GPU 15 ms, CPU 16 Threads 280 ms,
  # CPU 4 Threads 398 ms median / 0,9 s p90, Werte identisch (Abw. <= 0,002).
  # 6 Threads: Parakeet rechnet im Assistenten parallel mit 8 Threads auf der
  # CPU, beide starten gleichzeitig am Aufnahme-Ende. Zurueck auf die GPU:
  # devices: [nvidia.com/gpu=all] wieder einsetzen, OMP_NUM_THREADS raus.
  ser:
    build:
      context: ./ser
    container_name: ser
    environment:
      - OMP_NUM_THREADS=6
    ports:
      - "0.0.0.0:8002:8002"
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Gemma (llama.cpp CUDA) — lokaler Schalt-Aktuator des Voice-Assistant ──────
  # War zuvor ein handgestarteter Wegwerf-Container (podman run …). Als Dienst
  # in der Compose überlebt er Reboots und startet nach den anderen KI-Services.
  # -hf lädt unsloth/gemma-4-E2B-it-GGUF:Q4_K_M direkt aus dem HF-Cache auf dem
  # Host (/home/jochen/.cache/huggingface); -ngl 99 = alle Layer auf der GPU.
  llamacpp-gemma:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp-gemma
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "8090:8090"
    volumes:
      - /home/jochen/.cache/huggingface:/root/.cache/huggingface
    command:
      - "-hf"
      - "unsloth/gemma-4-E2B-it-GGUF:Q4_K_M"
      - "-ngl"
      - "99"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8090"
      - "--jinja"
      - "-c"
      - "8192"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Gemma auf der Vega-iGPU (llama.cpp Vulkan) — Aktuator seit 2026-09-23 ─────
  # Dasselbe GGUF wie llamacpp-gemma, aber auf der eingebauten Grafik des
  # Ryzen 7 5700G (/dev/dri/renderD128, PCI 0d:00.0; renderD129 ist die 3060 Ti).
  # Ziel: die 3060 Ti fuer anderes freimachen. llamacpp-gemma bleibt vorerst als
  # Rueckweg stehen.
  #
  # Gemessen 2026-09-23 (Aktuator, 32 Saetze aus actuator_grammar_test.py):
  # Token-Erzeugung ~23 tok/s gegen 100-134 auf der 3060 Ti — die iGPU teilt
  # sich DDR4-3200 mit der CPU. Tragbar erst, weil der Aktuator seither kaum
  # noch Token erzeugt (Torfrage ~290 ms, kompaktes JSON ~1,3 s).
  # KALTSTART: der erste Aufruf mit einem neuen Prompt kostet 8-12 s (Prefill
  # von ~2700 Token). Aufgewaermt wird deshalb vom Voice-Assistant nach jedem
  # capabilities-refresh, nicht hier — der Prompt entsteht erst dort.
  #
  # Zugriff: rootless podman braucht rw auf renderD128. Das setzt die udev-Regel
  # /etc/udev/rules.d/99-gastonllm-igpu.rules (ACL fuer jochen; ohne sie meldet
  # llama.cpp "no usable GPU found" und rechnet STILL auf der CPU).
  llamacpp-gemma-vega:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp-gemma-vega
    devices:
      - /dev/dri/renderD128
    security_opt:
      - label=disable
    ports:
      - "8091:8091"
    volumes:
      - /home/jochen/.cache/huggingface:/root/.cache/huggingface
    command:
      - "-hf"
      - "unsloth/gemma-4-E2B-it-GGUF:Q4_K_M"
      - "-ngl"
      - "99"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8091"
      - "--jinja"
      # Zwei Prompts (Torfrage + Klassifikation) mit je ~2700 Token muessen
      # gleichzeitig im Cache liegen; 4 Slots x 4096.
      - "-c"
      - "16384"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Laya — Aktuator-Klassifikator im Schattenbetrieb ─────────────────────────
  # Beantwortet fuer den Voice-Assistant Tor, Ziel und Aktion jedes Satzes, den
  # dessen Aktuator sieht — neben Gemma, ohne zu schalten (actuator.schatten_url,
  # Log actuator_schatten.log). Seit 2026-09-29; siehe voice_assistant/services/
  # aktuator_schatten.py im Repo openclaw_voice_assist.
  # Der Checkpoint ist auf die Ziele DIESES Hauses trainiert (tools/
  # laya_aktuator_train.py) und liegt deshalb nicht im Image und nicht im Repo,
  # sondern unter ${LAYA_MODELLE} auf dem Host. Neue Ziele = neu trainieren.
  # Nur lokal gebunden: laya-serve kennt keine Anmeldung.
  laya:
    build:
      context: ./laya
    container_name: laya
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      - LAYA_CKPT=/modelle/aktuator-v3
      - LAYA_DEVICE=cuda
      - HF_HUB_OFFLINE=1
    volumes:
      - ${LAYA_MODELLE}:/modelle:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Voice Analysis (CPU-only, Audio-Analyse + SER-backed Stimmung) ───────────
  voice-analysis:
    build:
      context: ./voice-analysis
    container_name: voice-analysis
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      speaches:
        condition: service_healthy
      ser:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Mood-Warmup ──────────────────────────────────────────────────────────────
  # Der ERSTE /mood-Aufruf nach einem Stack-Start kostet ~15 s, jeder weitere
  # 0,2 s. Der Voice-Assistant wartet aber nur DIARIZATION_TIMEOUT — ohne diesen
  # Warmup verliert der erste Sprach-Turn nach jedem Neustart seine
  # Stimmungsanalyse, und im Log steht ein irrefuehrendes "Mood: timed out".
  #
  # Die Zeit steckt NICHT im SER-Modell (das liegt beim Import im VRAM,
  # Inferenz 25-28 ms) und auch nicht im CUDA-Warmlauf — sondern in
  # `librosa.pyin` in voice-analysis: numba kompiliert die Funktion beim ersten
  # Aufruf. Ein Warmup direkt gegen ser:8002 bringt deshalb NICHTS, das war der
  # erste, falsche Anlauf. Der Aufruf muss ueber voice-analysis gehen — der
  # deckt beides ab, denn /mood ruft SER intern selbst auf.
  #
  # Eine Sekunde Stille genuegt, es geht nur darum, den Pfad einmal zu gehen.
  # Die WAV baut sich der Container per printf selbst (44-Byte-Header + Nullen),
  # damit keine Datei ins Repo muss.
  mood-warmup:
    image: quay.io/curl/curl:latest
    container_name: mood-warmup
    depends_on:
      voice-analysis:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        printf 'RIFF\x24\x7d\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00\x80\x3e\x00\x00\x00\x7d\x00\x00\x02\x00\x10\x00data\x00\x7d\x00\x00' > /tmp/warm.wav
        head -c 32000 /dev/zero >> /tmp/warm.wav
        echo "Warmup /mood (librosa/numba-JIT + SER)"
        curl -sf -m 180 -X POST http://voice-analysis:8001/mood -F "file=@/tmp/warm.wav" -o /dev/null \
          && echo "Mood ready." || echo "Mood-Warmup fehlgeschlagen (nicht fatal)."
    restart: "no"

volumes:
  # Die Volume-Namen sind ABSICHTLICH festgenagelt. Podman leitet sie sonst aus
  # dem Projektnamen ab (<projekt>_<volume>) — beim Umbenennen des Projekts von
  # ai-stack-gastonllm auf voice-gastonllm waeren also zwei leere Volumes
  # entstanden und der komplette Whisper-/Piper-Cache neu heruntergeladen
  # worden. Mit explizitem `name:` ueberlebt der Cache jede Umbenennung.
  # Deshalb steht hier der ALTE Projektname — das ist kein Versehen.
  speaches-cache:
    name: ai-stack-gastonllm_speaches-cache
  speaches-cuda-cache:
    name: ai-stack-gastonllm_speaches-cuda-cache
