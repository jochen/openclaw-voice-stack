name: voice-misterhandy

# FabLab-Sprachkiste "misterhandy" (Dell T3600, 192.168.111.199): 2x Tesla M60
# (Maxwell, sm_52, je 8 GB), Treiber 580-server, Podman 4.9 (Ubuntu 24.04),
# Xeon E5-1620 (4 Kerne, KEIN AVX2). Loest rouven ab (Stand 2026-11-21).
#
# Rollen (wie gastonllm):
#   - Qwen3-ASR (llamacpp-qwenasr)  -> fuehrende Spracherkennung, GPU 0
#   - voice-analysis + ser          -> Sprecher-Fingerabdruck + Stimmung, ser auf GPU 0
#   - speaches                       -> NUR Rueckfall (Whisper-STT, Piper-TTS), CPU
#   - cosyvoice (Sprachausgabe)      -> LLM GPU 1, Flow+HiFi-GAN GPU 0 (siehe cosyvoice-m60/dienst.py)
# Keine Diarization mehr (seit 2026-10-07 Fingerabdruck statt Diarization).
#
# GPU im Container: CDI (nvidia.com/gpu=N). Podman 4.9 versteht die Spec von
# nvidia-ctk nur nach Uebersetzung durch misterhandy-cdi-patch (Repo
# fablab/misterhandy-host). Fehlt /etc/cdi/nvidia.yaml -> "unresolvable CDI devices".
#
# restart: always (nicht unless-stopped): podman-restart.service startet nach
# einem Reboot NUR Container mit Policy "always".
#
# Starten: podman-compose -f compose.misterhandy.yml up -d   (podman-compose >= 1.6 per pipx;
# das 1.0.6 aus Ubuntu kann depends_on/condition nicht)

services:

  # ── Qwen3-ASR (llama.cpp CUDA) — fuehrende STT ────────────────────────────
  # Gleiches Image wie rouven/gastonllm. Mit Treiber 580 ohne CUDA-Compat-Trick.
  # Die M60 braucht JIT-Kernel (erster Aufruf ~6 s), der Cache haelt sie ueber
  # Container-Neustarts. Gemessen 2026-11-20: 0,6 s fuer 5 s Audio (rouven 0,9 s).
  llamacpp-qwenasr:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:e8318a7b3988f9ca57b28c03486569e60def08f2b7b060550ebfa046e175e6cb
    container_name: llamacpp-qwenasr
    devices:
      - nvidia.com/gpu=0
    security_opt:
      - label=disable
    ports:
      - "0.0.0.0:8094:8094"
    environment:
      - CUDA_CACHE_PATH=/cuda-cache
      - CUDA_CACHE_MAXSIZE=1073741824
    volumes:
      - ${HOME}/modelle/qwen3-asr:/modelle:ro
      - ${HOME}/.cache/qwenasr-cuda:/cuda-cache
    command:
      - "-m"
      - "/modelle/Qwen3-ASR-1.7B-Q8_0.gguf"
      - "--mmproj"
      - "/modelle/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf"
      # Audio-Encoder auf der CPU wie auf rouven (dort wegen Diarization-Speicher).
      # Hier gibt es keine Diarization mehr; ob der Encoder auf der M60 schneller
      # ist, ist noch nicht gemessen -> vorerst wie rouven.
      - "--no-mmproj-offload"
      - "-ngl"
      - "99"
      - "-c"
      - "2048"
      - "-ub"
      - "256"
      - "-np"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8094"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8094/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Speaches — nur Rueckfall, CPU ─────────────────────────────────────────
  # CUDA-Variante bewusst nicht: fuer einen Rueckfall keine sm_52-Bastelei.
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: speaches
    ports:
      - "8000:8000"
    environment:
      - STT_MODEL_TTL=-1
      - TTS_MODEL_TTL=-1
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
      # piper 1.3.0 + Korrektur aus 1.4.1: [[Phoneme]] am Satzende erzeugte ein Geraeusch
      - ./patches/piper_voice.py:/home/ubuntu/speaches/.venv/lib/python3.12/site-packages/piper/voice.py:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  speaches-warmup:
    image: quay.io/curl/curl:latest
    container_name: speaches-warmup
    depends_on:
      speaches:
        condition: service_healthy
    environment:
      - STT_MODEL=guillaumekln/faster-whisper-small
      - TTS_MODEL=speaches-ai/piper-de_DE-thorsten-medium
      - TTS_VOICE=de_DE-thorsten-medium
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        echo "Registering STT: $STT_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$STT_MODEL" || true
        echo "Registering TTS: $TTS_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$TTS_MODEL" || true
        echo "Warmup TTS (piper)"
        curl -sf -X POST http://speaches:8000/v1/audio/speech \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$TTS_MODEL\",\"voice\":\"$TTS_VOICE\",\"input\":\"Aufwärmen.\",\"response_format\":\"wav\"}" \
          -o /tmp/warmup.wav
        echo "Warmup STT (whisper)"
        curl -sf -X POST http://speaches:8000/v1/audio/transcriptions \
          -F "file=@/tmp/warmup.wav" -F "model=$STT_MODEL" -F "language=de"
        echo ""
        echo "Speaches models ready."
    restart: "no"

  # ── SER – Speech Emotion Recognition, GPU 0 ───────────────────────────────
  # torch 2.6 + cu118 (sm_52), siehe ser/Dockerfile. Gemessen 2026-11-21:
  # ~150 ms warm auf der M60.
  ser:
    build:
      context: ./ser
      args:
        TORCH_VERSION: "2.6.0"
        TORCH_INDEX: cu118
    container_name: ser
    devices:
      - nvidia.com/gpu=0
    security_opt:
      - label=disable
    ports:
      - "0.0.0.0:8002:8002"
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Voice Analysis — Sprecher-Fingerabdruck (/fingerabdruck) + /mood ──────
  voice-analysis:
    build:
      context: ./voice-analysis
    container_name: voice-analysis
    environment:
      - STT_MODEL=guillaumekln/faster-whisper-small
      # 4 Kerne / 8 Threads
      - FINGERABDRUCK_THREADS=4
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      speaches:
        condition: service_healthy
      ser:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mood-warmup:
    image: quay.io/curl/curl:latest
    container_name: mood-warmup
    depends_on:
      voice-analysis:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        printf 'RIFF\x24\x7d\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00\x80\x3e\x00\x00\x00\x7d\x00\x00\x02\x00\x10\x00data\x00\x7d\x00\x00' > /tmp/warm.wav
        head -c 32000 /dev/zero >> /tmp/warm.wav
        echo "Warmup /mood (librosa/numba-JIT + SER)"
        curl -sf -m 180 -X POST http://voice-analysis:8001/mood -F "file=@/tmp/warm.wav" -o /dev/null \
          && echo "Mood ready." || echo "Mood-Warmup fehlgeschlagen (nicht fatal)."
    restart: "no"

  # ── CosyVoice3 — Sprachausgabe (Antworten), fuer mehrere Assistenten ─────────
  # Schnittstelle wie cosy_dienst.py auf .126 (Port 8010, /v1/audio/speech gestreamt, /v1/voices).
  # Auf den M60 ohne vLLM/TensorRT: einzelne Saetze RTF ~1,2, aber gleichzeitige Anfragen laufen als
  # Pipeline (LLM FIFO am Stueck auf GPU 1, Flow parallel auf GPU 0) -> Durchsatz RTF ~0,96.
  # Der Voice-Assistant plant deshalb Pausen zwischen den Saetzen. Gedacht auch fuer Gaston
  # (gastonllm ueber das VPN): Stimmen der Assistenten liegen in eigenen Namensraeumen.
  # Modell: ~/modelle/cosyvoice3/Fun-CosyVoice3-0.5B-2512 (HF FunAudioLLM/Fun-CosyVoice3-0.5B-2512,
  # Revision 29e01c4e, ohne *.plan / estimator.onnx / batch.onnx). Fest geladene Stimmen: ~/cosyvoice-stimmen
  # (<name>.wav + <name>.txt, wie STIMMEN_DIR auf .126).
  cosyvoice:
    build:
      context: ./cosyvoice-m60
    container_name: cosyvoice
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "0.0.0.0:8010:8010"
    environment:
      - LLM_GPU=1
      - FLOW_GPU=0
      - SCHRITTE=5
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HOME}/modelle/cosyvoice3:/modelle:ro
      - ${HOME}/cosyvoice-stimmen:/stimmen:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  speaches-cache:
    name: voice-misterhandy_speaches-cache
