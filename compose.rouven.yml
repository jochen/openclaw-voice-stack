name: ai-stack-rouven

services:

  # ── Speech AI ────────────────────────────────────────────────────────────────
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    container_name: speaches
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "8000:8000"
    environment:
      # GTX 1660 hat keine Tensor Cores (im Gegensatz zu RTX 5060 Ti auf 126) -
      # int8/float16 CTranslate2-Kernel liefern auf dieser GPU stillschweigend
      # falschen Text (Whisper-Halluzination bzw. Garbage-Output), verifiziert
      # 2026-07-08. float32 ist bisher die einzige verifiziert korrekte GPU-Option.
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float32
      - STT_MODEL_TTL=-1
      - TTS_MODEL_TTL=-1
      - CUDA_CACHE_PATH=/home/ubuntu/.cache/cuda
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
      - speaches-cuda-cache:/home/ubuntu/.cache/cuda
      - ./scripts/speaches-entrypoint.sh:/speaches-entrypoint.sh:ro
      - ./patches/onnx_diarization_pipeline.py:/home/ubuntu/speaches/.venv/lib/python3.12/site-packages/onnx_diarization/pipeline.py:ro
      # piper 1.3.0 + Korrektur aus 1.4.1: [[Phoneme]] am Satzende erzeugte ein Geraeusch
      - ./patches/piper_voice.py:/home/ubuntu/speaches/.venv/lib/python3.12/site-packages/piper/voice.py:ro
    entrypoint: ["/speaches-entrypoint.sh"]
    command: ["uvicorn", "--factory", "speaches.main:create_app"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  speaches-warmup:
    image: quay.io/curl/curl:latest
    container_name: speaches-warmup
    depends_on:
      speaches:
        condition: service_healthy
    environment:
      # small, NICHT medium: medium float32 + ser + Diarization sprengen die
      # 6 GB der GTX 1660 (CUDA OOM -> HTTP 500, scheinbar zufaellig). Lag
      # bis 2026-10-07 nur als lokale Aenderung auf dem Host.
      - STT_MODEL=guillaumekln/faster-whisper-small
      - TTS_MODEL=speaches-ai/piper-de_DE-thorsten-medium
      - TTS_VOICE=de_DE-thorsten-medium
      - DIARIZATION_SEGMENTATION_MODEL=fedirz/segmentation_community_1
      - DIARIZATION_EMBEDDING_MODEL=Wespeaker/wespeaker-voxceleb-resnet34-LM
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        echo "Registering STT: $STT_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$STT_MODEL" || true
        echo "Registering TTS: $TTS_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$TTS_MODEL" || true
        echo "Registering Diarization: $DIARIZATION_SEGMENTATION_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$DIARIZATION_SEGMENTATION_MODEL" || true
        echo "Registering Diarization: $DIARIZATION_EMBEDDING_MODEL"
        curl -s -X POST "http://speaches:8000/v1/models/$DIARIZATION_EMBEDDING_MODEL" || true
        echo "Warmup TTS (piper -> VRAM)"
        curl -sf -X POST http://speaches:8000/v1/audio/speech \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$TTS_MODEL\",\"voice\":\"$TTS_VOICE\",\"input\":\"Aufwärmen.\",\"response_format\":\"wav\"}" \
          -o /tmp/warmup.wav
        echo "Warmup STT (whisper -> VRAM)"
        curl -sf -X POST http://speaches:8000/v1/audio/transcriptions \
          -F "file=@/tmp/warmup.wav" -F "model=$STT_MODEL" -F "language=de"
        echo ""
        echo "Speaches models ready."
    restart: "no"

  # ── SER – Speech Emotion Recognition (wav2vec2-large) ────────────────────────
  # Seit 2026-10-07 auf der CPU (keine GPU-Geraete -> app.py nimmt "cpu"),
  # wie auf gastonllm (384f117): macht 1,1 GB auf der GTX 1660 frei, damit
  # Qwen3-ASR Platz hat. rouven hat 12 Kerne und sonst keine CPU-Last.
  # Zurueck auf die GPU: devices: [nvidia.com/gpu=all] wieder einsetzen.
  ser:
    build:
      context: ./ser
    container_name: ser
    environment:
      - OMP_NUM_THREADS=8
    ports:
      - "0.0.0.0:8002:8002"
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Voice Analysis (CPU-only, Audio-Analyse + SER-backed Stimmung) ───────────
  voice-analysis:
    build:
      context: ./voice-analysis
    container_name: voice-analysis
    environment:
      # Re-STT von /analyze (nur das Brain-Werkzeug /analyze-last; die
      # Live-Stimmung /mood transkribiert nicht): dasselbe Modell wie
      # speaches-warmup. Mit medium laedt Speaches es nach -> CUDA OOM,
      # Speaches danach 3,6 statt 2,2 GB (im Lasttest 2026-10-07 gesehen).
      - STT_MODEL=guillaumekln/faster-whisper-small
      # /fingerabdruck fuer die Sprecher-Verifikation des Fablab-Pi (der Pi 4
      # braucht dafuer 2,8 s, hier ~50 ms). Modell aus dem HF-Cache.
      - FINGERABDRUCK_THREADS=4
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      speaches:
        condition: service_healthy
      ser:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Qwen3-ASR (llama.cpp CUDA) — erste STT-Stufe des Fablab-Assistenten ─────
  # Wie llamacpp-qwenasr in compose.gastonllm.yml, aber von aussen erreichbar
  # (der Assistent laeuft auf dem Pi). Gewichte als feste Dateien in
  # ~/modelle/qwen3-asr (Revision 36a6786, sha256 wie auf gastonllm), nicht
  # per -hf: so haengt der Start nicht am HF-Cache-Layout. Holen:
  #   curl -L -o <datei> https://huggingface.co/ggml-org/Qwen3-ASR-1.7B-GGUF/resolve/36a678687ba7d07a74ca70ccb0e36902e005fb80/<datei>
  # fuer Qwen3-ASR-1.7B-Q8_0.gguf und mmproj-Qwen3-ASR-1.7B-Q8_0.gguf.
  llamacpp-qwenasr:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:e8318a7b3988f9ca57b28c03486569e60def08f2b7b060550ebfa046e175e6cb
    container_name: llamacpp-qwenasr
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "0.0.0.0:8094:8094"
    # Die GTX 1660 (sm_75) braucht beim ersten Lauf JIT-uebersetzte Kernel:
    # gemessen 26 s fuer die erste Anfrage, 2-6 s fuer die naechsten Formen —
    # laenger als die 15 s Wartegrenze der STT. Der Cache auf dem Host haelt
    # das ueber Container-Neustarts.
    environment:
      - CUDA_CACHE_PATH=/cuda-cache
      - CUDA_CACHE_MAXSIZE=1073741824
    volumes:
      - ${HOME}/modelle/qwen3-asr:/modelle:ro
      - ${HOME}/.cache/qwenasr-cuda:/cuda-cache
    command:
      - "-m"
      - "/modelle/Qwen3-ASR-1.7B-Q8_0.gguf"
      - "--mmproj"
      - "/modelle/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf"
      # Audio-Encoder auf der CPU (12 Kerne): gemessen 2026-10-07 gleich
      # schnell (0,39 s / 0,92 s fuer 5-s- / 15-s-Clip), GPU 2,1 statt 3,0 GB.
      # Mit Encoder auf der GPU fand die Speaches-Diarization keine 120 MB
      # mehr -> HTTP 500 bei JEDEM Aufruf, auch ohne parallele Last.
      - "--no-mmproj-offload"
      - "-ngl"
      - "99"
      - "-c"
      - "2048"
      - "-ub"
      - "256"
      - "-np"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8094"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8094/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  speaches-cache:
  speaches-cuda-cache:
